<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>walert · Abri inondation</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <meta name="description" content="Candidate flood shelters reachable by a dry route, July 2021 floods area, Wallonia">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="assets/logo_horizontal.png" alt="walert" class="logo" width="160" height="49">
      <h1 data-t="title"></h1>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <a id="adminLink" class="switch" data-t="adminView" hidden></a>
      <button data-lang="fr">FR</button><button data-lang="de">DE</button><button data-lang="en">EN</button>
    </div>
  </header>
  <div class="banner" role="alert"><strong data-t="notOfficial"></strong> <span data-t="call112"></span></div>

  <main>
    <section class="controls">
      <label for="muni" data-t="muniLabel"></label>
      <div class="row">
        <select id="muni"></select>
        <button id="locate" class="secondary" data-t="locate"></button>
      </div>
      <p class="hint" data-t="tapHint"></p>

      <fieldset>
        <legend data-t="scenarioLabel"></legend>
        <div class="scenarios" role="group">
          <button data-scen="rp10" data-t="rp10"></button>
          <button data-scen="rp100" data-t="rp100"></button>
          <button data-scen="rp500" data-t="rp500"></button>
          <button data-scen="observed_2021" data-t="observed"></button>
        </div>
      </fieldset>
      <label class="check"><input type="checkbox" id="prm"> <span data-t="prmLabel"></span></label>
    </section>

    <div id="map" aria-label="Map"></div>
    <section id="result" aria-live="polite"></section>
  </main>

  <footer>
    <p data-t="footerCandidates"></p>
    <p data-t="footerPrivacy"></p>
    <p id="sources"></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
